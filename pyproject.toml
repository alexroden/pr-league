[project]
name = "pr-league"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1",
    "boto3>=1.43.109",
    "pyyaml>=6.0.3",
]

[project.scripts]
pr-league = "pr_league.main:cli"
pr-league-admin = "pr_league.admin:cli"

[dependency-groups]
dev = [
    "moto[dynamodb]>=5.2.3",
    "pytest>=8",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_league"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=pr_league --cov-fail-under=85"

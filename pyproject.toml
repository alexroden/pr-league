[project]
name = "pr-league"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "pyyaml>=6", "python-dotenv>=1"]

[project.scripts]
pr-league = "pr_league.main:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_league"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
